version: '3.8'

services:
  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: seckill-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  # Backend Replica 1
  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seckill-backend-1
    restart: always
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - PG_DSN=host=postgres user=user password=password dbname=seckill port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - USE_PG=true
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis

  # Backend Replica 2
  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seckill-backend-2
    restart: always
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - PG_DSN=host=postgres user=user password=password dbname=seckill port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - USE_PG=true
    ports:
      - "3002:3000"
    depends_on:
      - postgres
      - redis

  # Backend Replica 3
  backend-3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seckill-backend-3
    restart: always
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - PG_DSN=host=postgres user=user password=password dbname=seckill port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - USE_PG=true
    ports:
      - "3003:3000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: seckill-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: seckill
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: seckill-redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data:
